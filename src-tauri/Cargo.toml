[package]
name = "dropper"
version = "0.2.3"
description = "간편한 로컬 영상 압축"
edition = "2021"
rust-version = "1.96"
publish = false

[lib]
name = "dropper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dropper"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri = { version = "2.11", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7", optional = true }

# rust-lang/rust#157750: stripping proc-macro dylibs can misalign LINKEDIT on macOS 27.
[profile.release]
strip = "none"
