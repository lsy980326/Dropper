name: Windows installer verification

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare build tools
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --yes --no-progress --limit-output
          }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Prepare dependencies and test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm test
          python -m unittest discover -s tests/packaging -v
          python scripts/fetch-windows-media.py
          python scripts/bundle-media.py --windows --source-dir artifacts/windows-media --output src-tauri/resources/media-windows
          "$pwd\artifacts\windows-media" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Core tests on Windows
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -c "import subprocess; p=subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-f','lavfi','-i','color=size=256x144:rate=30','-frames:v','3','-c:v','libsvtav1','-svtav1-params','lp=1','-f','null','-'],capture_output=True,text=True); print(p.stderr); p.check_returncode()"
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Reject a release that would use the development server
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo check --manifest-path src-tauri/Cargo.toml --release --locked --target x86_64-pc-windows-msvc --target-dir src-tauri/target-windows *> artifacts/rejected-dev-build.log
          if ($LASTEXITCODE -eq 0 -or -not (Select-String -Path artifacts/rejected-dev-build.log -SimpleMatch 'Desktop release builds must embed frontend assets')) {
            Get-Content artifacts/rejected-dev-build.log
            throw 'The release guard did not reject the development build as expected'
          }
          Write-Output 'Development-mode release rejected by the real application compiler guard.'
          exit 0
      - name: Build the production installer
        run: npm run bundle
      - name: Verify upgrade from the previous installer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          gh release download v0.2.2 --pattern Dropper_0.2.2_Windows_x64_setup.exe --dir artifacts/previous
          $old = 'artifacts/previous/Dropper_0.2.2_Windows_x64_setup.exe'
          if ((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5e9b2c9f6442d419a220bc4c2ef94599aeb1b726f23089115aac0c8037c8d151') { throw 'Previous installer checksum mismatch' }
          $process = Start-Process -FilePath $old -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Previous installer exited $($process.ExitCode)" }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $process = Start-Process -FilePath "artifacts/Dropper_${version}_x64-setup.exe" -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "New installer exited $($process.ExitCode)" }
      - name: Installed app offline startup and compression
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output "Test host elevated=$elevated; interactive=$([Environment]::UserInteractive); session=$((Get-Process -Id $PID).SessionId)"
          whoami /groups | Select-String -SimpleMatch 'S-1-16-'
          $runtime = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          Write-Output "WebView2 runtime=$($runtime.pv)"
          # Elevated WebView2 ignores environment overrides, but honors app-scoped HKLM policy.
          # https://learn.microsoft.com/microsoft-edge/webview2/concepts/security
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          $previous = $null
          if ($elevated) {
            $previous = (Get-ItemProperty -Path $key -Name 'dropper.exe' -ErrorAction SilentlyContinue).'dropper.exe'
            New-Item -Path $key -Force | Out-Null
            New-ItemProperty -Path $key -Name 'dropper.exe' -PropertyType String -Value '--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1' -Force | Out-Null
          }
          try {
            npm run test:windows-install
          } finally {
            if ($elevated) {
              if ($null -eq $previous) {
                Remove-ItemProperty -Path $key -Name 'dropper.exe'
              } else {
                Set-ItemProperty -Path $key -Name 'dropper.exe' -Value $previous
              }
            }
          }
      - name: Upload verified installer to a draft release
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $file = "artifacts/Dropper_${version}_x64-setup.exe"
          $sum = "artifacts/Dropper_${version}_Windows_SHA256SUMS.txt"
          "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  Dropper_${version}_Windows_x64_setup.exe" | Set-Content $sum -Encoding ascii
          Copy-Item $file "artifacts/Dropper_${version}_Windows_x64_setup.exe"
          $candidate = "artifacts/Dropper_${version}_Windows_x64_setup.exe"
          $existing = (gh release list --json tagName,isDraft | ConvertFrom-Json) | Where-Object tagName -eq $tag
          if ($existing -and -not $existing.isDraft) {
            Write-Output 'This version is already published; its assets were not changed.'
          } elseif ($existing) {
            gh release edit $tag --target $env:GITHUB_SHA
            gh release upload $tag $candidate $sum --clobber
          } else {
            gh release create $tag $candidate $sum --draft --target $env:GITHUB_SHA --title "Dropper $tag" --notes 'Windows 설치 후 서버 없는 시작과 실제 압축 검사를 통과한 빌드입니다.'
          }
